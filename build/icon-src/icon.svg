<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6f5f1"/>
      <stop offset="1" stop-color="#e7e5dc"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfaf7"/>
    </linearGradient>
  </defs>

  <!-- squircle background -->
  <rect x="96" y="96" width="832" height="832" rx="186" fill="url(#bg)"/>
  <rect x="98" y="98" width="828" height="828" rx="184" fill="none" stroke="#1d1d1f" stroke-opacity="0.08" stroke-width="4"/>

  <!-- report sheet -->
  <rect x="296" y="214" width="432" height="560" rx="40" fill="#1d1d1f" opacity="0.10"/>
  <rect x="296" y="200" width="432" height="560" rx="40" fill="url(#sheet)" stroke="#e4e2da" stroke-width="3"/>

  <!-- doc header: title bar + ink rule (mirrors app .doc-head) -->
  <rect x="356" y="272" width="196" height="30" rx="15" fill="#1d1d1f"/>
  <rect x="356" y="330" width="312" height="7" rx="3.5" fill="#1d1d1f"/>

  <!-- score rows: track + bar -->
  <rect x="356" y="392" width="312" height="34" rx="17" fill="#efede8"/>
  <rect x="356" y="392" width="276" height="34" rx="17" fill="#25683f"/>

  <rect x="356" y="458" width="312" height="34" rx="17" fill="#efede8"/>
  <rect x="356" y="458" width="218" height="34" rx="17" fill="#3c5374"/>

  <rect x="356" y="524" width="312" height="34" rx="17" fill="#efede8"/>
  <rect x="356" y="524" width="160" height="34" rx="17" fill="#9c5a06"/>

  <!-- faint footer lines -->
  <rect x="356" y="608" width="240" height="12" rx="6" fill="#e4e2da"/>
  <rect x="356" y="640" width="180" height="12" rx="6" fill="#e4e2da"/>

  <!-- red grade stamp -->
  <g transform="rotate(-12 684 654)">
    <circle cx="684" cy="654" r="152" fill="#a63434"/>
    <circle cx="684" cy="654" r="152" fill="none" stroke="#7e2626" stroke-width="4"/>
    <circle cx="684" cy="654" r="120" fill="none" stroke="#ffffff" stroke-width="9" opacity="0.92"/>
    <text x="684" y="664" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-weight="800" font-size="132" fill="#ffffff" text-anchor="middle" dominant-baseline="middle">A+</text>
  </g>
</svg>

name: 기능 제안
description: 새 기능이나 개선 아이디어
title: "[feat] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제(불편)가 있나요
      description: 지금 무엇이 안 되거나 불편한지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 방법
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 참고
      description: 대안, 스크린샷, 관련 이슈 등이 있으면 적어 주세요.
    validations:
      required: false
